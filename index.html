<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cradle Duel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Cradle Duel</h1>
    <label class="claude-pick">Fighters
      <select id="pick0"></select> vs <select id="pick1"></select>
    </label>
    <label class="claude-pick">Claude plays
      <select id="claude-side"></select>
      via <select id="claude-via"><option value="api">the API</option><option value="chat">a chat</option></select>
    </label>
    <span class="topbar-gap"></span>
    <button id="restart" class="ghost">Restart</button>
    <button id="open-builder" class="ghost">Builder</button>
  </header>
  <main class="layout">
    <section class="board">
      <div class="vs">
        <section id="f0" class="panel fp"></section>
        <section id="f1" class="panel fp"></section>
      </div>
      <div id="field" class="panel field"></div>
      <div id="queue" class="panel queue"></div>
    </section>
    <section class="side">
      <div id="prompt" class="panel prompt"></div>
      <details id="claude-mind" class="panel mind" hidden>
        <summary><span class="label">Claude's thinking</span> <span id="claude-mind-count" class="muted small"></span></summary>
        <div id="claude-mind-list"></div>
      </details>
      <section id="log" class="panel log"></section>
    </section>
  </main>
  <div id="builder" class="builder" hidden></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
